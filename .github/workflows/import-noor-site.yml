name: Import Noor Communication site

on:
  push:
    paths:
      - "Noor_V4_2.part*"

permissions:
  contents: write

jobs:
  extract-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reassemble and extract V4.2
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/noor-v4.2.zip"
          cat Noor_V4_2.part* > "$archive"
          unzip -tq "$archive"
          rm -rf /tmp/noor-site
          mkdir -p /tmp/noor-site
          unzip -q "$archive" -d /tmp/noor-site
          test -f /tmp/noor-site/index.html
          test -f /tmp/noor-site/config.js
          cp -a /tmp/noor-site/. .
          rm -f Noor_V4_2.part*

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Noor Communication website V4.2"
            git push
          fi
